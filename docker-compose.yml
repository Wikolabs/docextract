version: "3.9"

# docextract demo — production-ready POC.
# 2 services orchestrated:
#   - docextract (Next.js frontend on host port 3020)
#   - docextract-backend (FastAPI Python, internal only on 8000)
# Internal network so the frontend can reach the backend by service name.

services:
  docextract-backend:
    image: ghcr.io/wikolabs/docextract-backend:latest
    container_name: docextract-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
  wkdemo_net:
    name: wkdemo-net
    external: true
networks:
  docextract-net:
    name: docextract-net
    driver: bridge