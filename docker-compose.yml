version: "3.9"

# docextract demo - production-ready POC.
# 2 services orchestrated:
#   - docextract (Next.js frontend on host port 3020)
#   - docextract-backend (FastAPI Python, internal only on 8000)
# Shared external network wkdemo-net (created once by deploy.yml) avoids
# Docker default address-pool exhaustion across all 47 LP stacks.

services:
  docextract-backend:
    image: ghcr.io/wikolabs/docextract-backend:latest
    container_name: docextract-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - wkdemo_net

  docextract:
    image: ghcr.io/wikolabs/docextract:latest
    container_name: docextract
    restart: unless-stopped
    ports:
      - "3020:3000"
    environment:
      BACKEND_URL: "http://docextract-backend:8000"
    depends_on:
      - docextract-backend
    networks:
      - wkdemo_net

networks:
  wkdemo_net:
    name: wkdemo-net
    external: true
